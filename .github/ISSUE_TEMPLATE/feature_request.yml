name: 功能建议
description: 提议 dsh-onestep 的新能力或体验改进（舞台/候场/编排/键盘/无障碍/伴生窗/性能/兼容）。
title: "[feat] "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        ## 提交前请先确认

        - 先读 README 的「核心体验」与「已知限制」：部分能力是**已声明的产品取舍**，属于后续版本范围，请先确认不是重复建议。
        - 先搜索现有 issue 与路线图。
        - **不要**在建议里粘贴 token/凭据/会话内容等敏感信息。

  - type: input
    id: problem
    attributes:
      label: 想解决的问题（一句话）
      description: 你遇到的摩擦点，而不是先给实现方案。
      placeholder: "同时盯 3 个后台会话时，很难快速判断哪个在等我批准"
    validations:
      required: true

  - type: textarea
    id: scenario
    attributes:
      label: 使用场景
      description: 描述真实工作流（几个会话、怎么切换、期望的反馈形式）。
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 期望的行为
      description: 交互上你希望发生什么；可附示意图（请先脱敏）。
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: 涉及范围
      options:
        - 舞台与候场窗（布局/缩略/比例）
        - 拖拽编排与入口
        - 快速新建
        - 键盘与无障碍
        - 窗口级反馈（完成/待处理）
        - 伴生窗（官方右侧栏）
        - 性能与降级
        - 版本兼容与安装
        - 文档 / i18n
        - 其他
    validations:
      required: true

  - type: dropdown
    id: boundary
    attributes:
      label: 是否属于已声明的限制或路线图范围
      description: 参考 README 的「已知限制」。
      options:
        - 不是，属于现有能力内的改进
        - 是已声明的暂缓能力
        - 不确定，请维护者判断
    validations:
      required: true

  - type: input
    id: alternatives
    attributes:
      label: 现有替代方式
      description: 当前先怎么绕过（官方能力、设置项、手动流程），没有就写「无」。
      placeholder: "暂时用左栏状态点 + 手动切换会话"
    validations:
      required: false

  - type: textarea
    id: extra
    attributes:
      label: 附加信息
      description: 草图、参考截图（脱敏）、其他插件的类似实现等。
    validations:
      required: false

  - type: checkboxes
    id: confirm
    attributes:
      label: 确认
      options:
        - label: 我已搜索现有 issue，未发现重复
          required: true
        - label: 我确认内容不含 token/凭据/会话内容等敏感信息
          required: true
